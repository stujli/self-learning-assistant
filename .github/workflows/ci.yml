name: Linux CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -c "import self_learning_assistant.cli.main,sys; assert 'torch' not in sys.modules"
      - run: uv run --no-sync sla --help
      - run: uv run --no-sync sla init --json
      - run: uv run --no-sync sla doctor --json
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra mcp
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync mypy src/self_learning_assistant
      - run: uv run --no-sync python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/self_learning_assistant-*.whl
            dist/self_learning_assistant-*.tar.gz
            dist/SHA256SUMS
